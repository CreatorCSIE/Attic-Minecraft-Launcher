name: Release（全平台矩阵）

# Phase 5：主壳 = Tauri（Windows Inno Setup x64+arm64 / macOS DMG arm64 / Linux deb+AppImage x64），
# 兜底 = Electron 22 Inno Setup（x64 + ia32，Win7 SP1 下限）。
# 2026-10-24 路线拍板：Windows 安装器双壳 NSIS → Inno（仓库级 installer/attic.iss 一份，
# flavor 参数化；nsis target 全部退场）。updater 产物 = ISCC 输出 + `tauri signer sign` 手动签名。
# 分发口径（用户拍板 2026-10-23）：Win/Mac arm64 照常发（壳原生，游戏侧走 x64 模拟 / Rosetta，
# 见 depends.ts 闸门）；Linux 优先 Debian 系（deb，arch/redhat 有需求再说），linux arm64 不分发
# （LWJGL2 无 arm64 原生库且无系统级模拟）。
# portable 目录构件 = Windows 四腿（tauri x64/arm64、electron x64、legacy x64；B 期 2026-10-25 终拍①：
# 与安装器同载荷、零预带 .attic、顶层收进 amcl-<shell>-windows-<arch>-<ver>/ 文件夹、程序目录 marker 位
# 写出厂 portable.ini、根附「先解压再运行.txt」防呆）；linux tar.xz 与 MSI 双轨 = 后续条目（plan.md）。
#
# 触发与两种形态（2026-10 开放 artifacts 通道）：
#  · tag v*  = 正式发版形态（全签名 + updater 产物）。
#  · workflow_dispatch（或直推分支）= 编译+打包测试形态：版本一律钉 0.0.0、
#    无 Secrets 时自动跳过 Windows signer 签名步骤、mac/linux 构建带
#    createUpdaterArtifacts=false 覆盖（updater 产物需私钥，无钥即构建炸）。
# 文档/媒体免触发（2026-10-25）：纯 .md / 图片改动只走 ci.yml，不起全平台矩阵——
# paths-ignore 对 tag push 同样生效（tag 与上一 tag 的 diff 若纯文档也不出构件），
# 真要发版被误拦时 workflow_dispatch 手动兜底。
on:
  workflow_dispatch: {}
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - '**.ico'
      - '**.webp'

jobs:
  gates:
    name: 发布前置闸门（全绿才出构件）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm run fixtures:check
      - run: pnpm run gate:node16

  # 两 Windows 架构 = 一 job 两 matrix 腿（90% 步骤相同，差异全在 include 四元组：
  # build_args / exe / arch 标签；stage、ISCC、sign、upload 单点维护勿再复制成双）
  tauri-windows:
    name: Tauri Inno · windows-${{ matrix.arch }}（x64 主发布轨 + arm64 持续线）
    runs-on: windows-latest
    needs: gates
    strategy:
      # arm64 腿依赖 runner 的 MSVC ARM64 组件（缺失首跑即在此报错，装组件即可）——
      # 不许连坐 x64 主发布轨
      fail-fast: false
      matrix:
        include:
          - arch: x64
            build_args: ""
            exe: apps/tauri/src-tauri/target/release/attic-launcher.exe
          - arch: arm64
            build_args: "--target aarch64-pc-windows-msvc"
            exe: apps/tauri/src-tauri/target/aarch64-pc-windows-msvc/release/attic-launcher.exe
    env:
      # updater minisign 私钥只在发版 CI 注入（公钥已入 tauri.conf.json，plan 发版 SOP）
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Pin Inno Setup
        run: winget install --id JRSoftware.InnoSetup --exact --version 6.7.3 --silent --accept-package-agreements --accept-source-agreements
      - name: Add rust target (arm64)
        if: matrix.arch == 'arm64'
        run: rustup target add aarch64-pc-windows-msvc
      # --no-bundle：nsis 已退场；bundler 的 resources 拷贝不随 --no-bundle 发生，
      # stage 目录显式组包（exe + sidecar/server.cjs = Tauri v2 Windows Resource 基目录
      # 即 exe 同目录的解析位，与 lib.rs resolve 对账过）
      - name: Tauri build (exe only)
        run: pnpm --filter @attic/tauri exec tauri build ${{ matrix.build_args }} --no-bundle
      - name: Stage payload
        run: |
          mkdir stage
          cp ${{ matrix.exe }} stage/
          mkdir -p stage/sidecar
          cp apps/tauri/sidecar/dist/server.cjs stage/sidecar/
      # 拍板① sidecar 随行 node.exe（p4 首件）：x64 腿复制 runner node（x64 v22 ≥20 ✓）；
      # arm64 腿 runner node 是 x64 不可入包 → 官方 win-arm64 单文件，版本钉 + SHASUMS256
      # 运行时对账（哈希不硬编码）。落 stage 即随 [Files] 递归入 Inno 包（iss 零改动）；
      # lib.rs resolve_sidecar_launch 已认 exe 旁 node.exe（零代码改动）。
      - name: Stage sidecar node.exe
        shell: pwsh
        run: |
          if ('${{ matrix.arch }}' -eq 'x64') {
            Copy-Item (Get-Command node).Source stage\node.exe
          } else {
            $nv = 'v22.14.0'
            $zip = "node-$nv-win-arm64.zip"
            Invoke-WebRequest "https://nodejs.org/dist/$nv/$zip" -OutFile "$env:RUNNER_TEMP\$zip"
            $sums = (Invoke-WebRequest "https://nodejs.org/dist/$nv/SHASUMS256.txt").Content
            $want = (($sums -split "`n" | Where-Object { $_ -match [regex]::Escape($zip) } | Select-Object -First 1) -split '\s+')[0]
            $got = (Get-FileHash "$env:RUNNER_TEMP\$zip" -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $want) { throw "node zip sha256 mismatch: got=$got want=$want" }
            Expand-Archive "$env:RUNNER_TEMP\$zip" -DestinationPath "$env:RUNNER_TEMP\node-arm64"
            Copy-Item "$env:RUNNER_TEMP\node-arm64\node-$nv-win-arm64\node.exe" stage\node.exe
          }
          Get-Item stage\node.exe | Select-Object Name, Length
      # —— portable 目录构件（plan.md 2026-10-25 终拍①）：与安装器同载荷、零预带 .attic ——
      # Compress-Archive 戒律：System.IO.Compression 静默跳过空目录——预带空 .attic 会产"zip 里
      # 不存在、解压后也无"的幻影；数据根由应用首启 ensureLayout 建，zip 永不含它（守卫③断言）。
      # 同一戒律的反面推论：marker 必须住非空位——sidecar/ 由 server.cjs 保证非空（electron 腿
      # = resources/ 由 app.asar 保证非空），marker 绝不落在"靠 zip 自己建出来"的目录里。
      # 出厂 portable.ini 的 rootDir 留空 = 数据落 exe 旁 .attic（便携缺省）；
      # 用户经向导/设置页改目录时 runtime writePortablePointer 覆写本文件（相对位按程序目录解析）。
      - name: Portable zip
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = $env:GITHUB_REF_NAME.TrimStart('v') } else { $ver = '0.0.0' }
          $folder = "amcl-tauri-windows-${{ matrix.arch }}-$ver"
          $zip = "portable-dist\$folder-portable.zip"
          # 守卫①：安装器载荷必须干净——portable.ini 只许出现在便携 staging 副本里
          # （安装器载荷混入 marker = 安装版被双指纹误判成便携）
          $dirty = @(Get-ChildItem -Recurse -Force -Path stage -Filter portable.ini)
          if ($dirty.Count -gt 0) { throw "installer payload contaminated with portable.ini: $($dirty[0].FullName)" }
          New-Item -ItemType Directory -Force -Path "portable\$folder", portable-dist | Out-Null
          Copy-Item -Recurse stage\* "portable\$folder\"
          Set-Content -Path "portable\$folder\sidecar\portable.ini" -Encoding ascii -Value @(
            '# Attic portable marker - do not delete: portable identity depends on this file.',
            '# rootDir = portable data root pointer; relative paths resolve against the app folder;',
            '# leave empty (factory default) to keep data in .attic beside the exe.',
            'rootDir='
          )
          # 根防呆 txt：UTF-8 BOM（Win7 记事本 ANSI 回退面——无 BOM 中文 = 乱码 = 防呆失效）
          $txt = @"
          Attic 便携版 —— 请先解压整个文件夹，勿在压缩包里直接运行

          1. 右键本 zip 选「全部解压」，或把 $folder 整个文件夹拖到目标位置（桌面/U 盘），
             进入文件夹双击其中的启动器 exe 运行。
          2. 不要在 WinRAR/7-Zip 里直接双击 exe：那会解压到临时目录运行，程序检测到后拒绝启动，
             数据也会丢在临时目录里。
          3. 游戏数据默认放在 exe 旁的 .attic 文件夹——整个文件夹拷到哪，数据就跟到哪。
          4. 新版本下载：https://github.com/CreatorCSIE/Attic-Minecraft-Launcher/releases

          "@
          [System.IO.File]::WriteAllText("$PWD\portable\先解压再运行.txt", $txt, (New-Object System.Text.UTF8Encoding($true)))
          Compress-Archive -Path "portable\$folder", "portable\先解压再运行.txt" -DestinationPath $zip -Force
          # 守卫②：portable zip 缺 marker = fail（marker 丢 = 便携身份蒸发，整包成死包）
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead("$PWD\$zip")
          try { $names = @($z.Entries | ForEach-Object FullName) } finally { $z.Dispose() }
          if ($names -notcontains "$folder/sidecar/portable.ini") { throw "portable zip missing marker: $folder/sidecar/portable.ini" }
          # 守卫③：zip 含 .attic 条目 = fail（预带数据目录 = 构建机数据泄漏 + 空目录幻影面）
          $leak = @($names | Where-Object { $_ -like '*/.attic/*' -or $_ -like '.attic/*' })
          if ($leak.Count -gt 0) { throw "portable zip contaminated with .attic entry: $($leak[0])" }
      # 安装器本体 32-bit（ISCC 唯一形态），两架构 runner 都能直接跑；ARCH 标签只决定
      # 64-mode 与 IsWin64 闸门：x64 腿带闸门，arm64 腿不带（arm64/x64 主机皆放行，
      # 载荷本身即 arm64 原生）
      - name: ISCC (main flavor)
        shell: pwsh
        # 戒律（attic.iss 头注）：Inno 文件类路径相对基准 = .iss 目录而非 cwd，
        # PAYLOAD 必须绝对化（pwsh 下 $PWD 即 Windows 形）；OUTDIR 不传 = 缺省 "dist" 落 installer/dist；
        # 安装器图标两壳皆 Inno 缺省（用户终拍，不传 SetupIconFile）。
        # CI 首跑教训（2026-10）：bash 腿 = Git Bash，MSYS 会把 `/DATTIC_*=...` 当 POSIX 路径
        # 重写成 C:/Program Files/Git/DATTIC_*=... → ISCC 见多个"脚本文件名" exit 2；改 pwsh 根除。
        # 版本两形态：tag 用去 v 的 tag 名；非 tag（测试形态）钉 0.0.0（版本号未收口）。
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = $env:GITHUB_REF_NAME.TrimStart('v') } else { $ver = '0.0.0' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DATTIC_FLAVOR=tauri" "/DATTIC_PAYLOAD=$PWD\stage" `
            "/DATTIC_VERSION=$ver" "/DATTIC_ARCH=${{ matrix.arch }}" `
            'installer\attic.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 测试形态（无 Secrets）跳过签名——正式发版形态该步必有钥
      - name: Sign updater artifact
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then ver="${GITHUB_REF_NAME#v}"; else ver="0.0.0"; fi
          pnpm --filter @attic/tauri exec tauri signer sign "installer/dist/amcl-tauri-windows-${{ matrix.arch }}-${ver}-setup.exe"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amcl-tauri-windows-${{ matrix.arch }}
          path: |
            installer/dist/amcl-tauri-windows-${{ matrix.arch }}-*-setup.exe
            installer/dist/amcl-tauri-windows-${{ matrix.arch }}-*-setup.exe.sig
            portable-dist/amcl-tauri-windows-${{ matrix.arch }}-*-portable.zip

  # 双壳并进（2026-10-24 用户拍板）：Electron 壳 = Tauri 主壳之外的可选发行形态，
  # 仅 Windows（mac/linux 有社区需求再开）。更新策略 = 检查+提示+手动下载
  # （链路与主壳「检查更新」按钮同项挂账，见 plan.md）。
  electron-windows:
    name: Electron 壳 Inno · x64（可选形态）
    runs-on: windows-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 注意：本 job 不设 ELECTRON_SKIP_BINARY_DOWNLOAD——electron-builder 需要
      # Electron 33 二进制入包（legacy/tauri job 才跳）。
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pin Inno Setup
        run: winget install --id JRSoftware.InnoSetup --exact --version 6.7.3 --silent --accept-package-agreements --accept-source-agreements
      - name: Build bundles
        run: pnpm -r build
      - name: Guard brand icon (缺则 fail，禁静默回退默认 Electron 图标)
        run: test -f apps/electron/build/icon.ico
      - name: electron-builder (--dir x64)
        run: pnpm --filter @attic/electron run dist
      # —— portable 目录构件（B 期终拍①）：与安装器同载荷（win-unpacked）、零预带 .attic；
      # marker 住 resources/（app.asar 保证非空位）。Compress-Archive 空目录戒律与出厂 rootDir
      # 留空语义详见 tauri 腿 Portable zip 步头注（同一条戒律，三腿共用口径）——
      - name: Portable zip
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = $env:GITHUB_REF_NAME.TrimStart('v') } else { $ver = '0.0.0' }
          $folder = "amcl-electron-windows-x64-$ver"
          $zip = "portable-dist\$folder-portable.zip"
          $payload = 'apps\electron\release\win-unpacked'
          # 守卫①：安装器载荷必须干净（portable.ini 只许在便携 staging 副本里）
          $dirty = @(Get-ChildItem -Recurse -Force -Path $payload -Filter portable.ini)
          if ($dirty.Count -gt 0) { throw "installer payload contaminated with portable.ini: $($dirty[0].FullName)" }
          New-Item -ItemType Directory -Force -Path "portable\$folder", portable-dist | Out-Null
          Copy-Item -Recurse "$payload\*" "portable\$folder\"
          Set-Content -Path "portable\$folder\resources\portable.ini" -Encoding ascii -Value @(
            '# Attic portable marker - do not delete: portable identity depends on this file.',
            '# rootDir = portable data root pointer; relative paths resolve against the app folder;',
            '# leave empty (factory default) to keep data in .attic beside the exe.',
            'rootDir='
          )
          $txt = @"
          Attic 便携版 —— 请先解压整个文件夹，勿在压缩包里直接运行

          1. 右键本 zip 选「全部解压」，或把 $folder 整个文件夹拖到目标位置（桌面/U 盘），
             进入文件夹双击其中的启动器 exe 运行。
          2. 不要在 WinRAR/7-Zip 里直接双击 exe：那会解压到临时目录运行，程序检测到后拒绝启动，
             数据也会丢在临时目录里。
          3. 游戏数据默认放在 exe 旁的 .attic 文件夹——整个文件夹拷到哪，数据就跟到哪。
          4. 新版本下载：https://github.com/CreatorCSIE/Attic-Minecraft-Launcher/releases

          "@
          [System.IO.File]::WriteAllText("$PWD\portable\先解压再运行.txt", $txt, (New-Object System.Text.UTF8Encoding($true)))
          Compress-Archive -Path "portable\$folder", "portable\先解压再运行.txt" -DestinationPath $zip -Force
          # 守卫②③：缺 marker = fail；含 .attic 条目 = fail（口径同 tauri 腿）
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead("$PWD\$zip")
          try { $names = @($z.Entries | ForEach-Object FullName) } finally { $z.Dispose() }
          if ($names -notcontains "$folder/resources/portable.ini") { throw "portable zip missing marker: $folder/resources/portable.ini" }
          $leak = @($names | Where-Object { $_ -like '*/.attic/*' -or $_ -like '.attic/*' })
          if ($leak.Count -gt 0) { throw "portable zip contaminated with .attic entry: $($leak[0])" }
      # flavor="electron" 表在 attic.iss（AppId uk.attic.launcher.electron，与主壳
      # 分离可同机共存）；载荷路径相对基准 = .iss 目录 → $PWD 绝对化戒律同主壳
      - name: ISCC (electron x64)
        shell: pwsh
        # pwsh 戒律同主壳（Git Bash MSYS 会重写 /D 参数）；载荷路径绝对化
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = $env:GITHUB_REF_NAME.TrimStart('v') } else { $ver = '0.0.0' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DATTIC_FLAVOR=electron" "/DATTIC_PAYLOAD=$PWD\apps\electron\release\win-unpacked" `
            "/DATTIC_VERSION=$ver" "/DATTIC_ARCH=x64" `
            'installer\attic.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amcl-electron-windows-x64
          path: |
            installer/dist/amcl-electron-windows-x64-*-setup.exe
            portable-dist/amcl-electron-windows-x64-*-portable.zip

  tauri-macos-arm64:
    name: Tauri DMG · macOS arm64（持续线，Apple Silicon）
    runs-on: macos-latest # GitHub 托管 arm64 runner
    needs: gates
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # 游戏侧约束（depends.ts 闸门）：mac arm64 必须配 x86_64 JDK8 走 Rosetta——
      # 壳与 updater 原生 arm64，不影响分发。
      # Apple Developer 证书缺席时 tauri 跳过 codesign/notarize，用户需右键打开绕 Gatekeeper；
      # 上正式签名时补 APPLE_IDENTITY/APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID 环境组（TODO）。
      - name: Tauri build (arm64)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: pnpm --filter @attic/tauri exec tauri build --target aarch64-apple-darwin --bundles dmg
      # 测试形态（无 Secrets）：conf 钉了 updater pubkey 时无私钥会让 bundler 产 updater 件即炸，
      # 用 --config 关掉 updater 产物；tag 正式形态永不走此腿
      - name: Tauri build (arm64, no updater artifacts)
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: pnpm --filter @attic/tauri exec tauri build --target aarch64-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
      # bundler 产物名随 productName（含空格），统一归到 amcl 范式（2026-10-24 拍板）：
      # amcl-tauri-macos-arm64-<ver>.dmg / .app.tar.gz(.sig)
      - name: Normalize artifact names (amcl)
        shell: bash
        run: |
          shopt -s nullglob
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then ver="${GITHUB_REF_NAME#v}"; else ver="0.0.0"; fi
          cd apps/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle
          for f in dmg/*.dmg; do mv "$f" "dmg/amcl-tauri-macos-arm64-${ver}.dmg"; done
          for f in macos/*.app.tar.gz; do mv "$f" "macos/amcl-tauri-macos-arm64-${ver}.app.tar.gz"; done
          for f in macos/*.app.tar.gz.sig; do mv "$f" "macos/amcl-tauri-macos-arm64-${ver}.app.tar.gz.sig"; done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amcl-tauri-macos-arm64
          path: |
            apps/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/amcl-tauri-macos-arm64-*.dmg
            apps/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/amcl-tauri-macos-arm64-*.app.tar.gz*

  tauri-linux-x64:
    name: Tauri DEB · linux-x64（持续线，Debian 系优先）
    runs-on: ubuntu-22.04
    needs: gates
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install system deps (webkit2gtk 等，Tauri v2 Linux 官方清单)
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # 拍板 2026-10-23：Linux 优先 Debian 系（deb）；arch/redhat 有需求再说。
      # AppImage 随发：Tauri v2 updater 在 Linux 仅支持 AppImage 通道（endpoint 钉好后即生效）。
      # linux arm64 不分发（LWJGL2 无 arm64 原生库且无系统级模拟，启动会被闸门拦）。
      - name: Tauri build (deb + appimage)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: pnpm --filter @attic/tauri exec tauri build --bundles deb,appimage
      # 测试形态（无 Secrets）：同 mac 腿，关掉 updater 产物防无钥炸
      - name: Tauri build (deb + appimage, no updater artifacts)
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: pnpm --filter @attic/tauri exec tauri build --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
      # bundler 产物名随 productName（含空格），统一归到 amcl 范式（同 mac 腿注记）
      - name: Normalize artifact names (amcl)
        shell: bash
        run: |
          shopt -s nullglob
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then ver="${GITHUB_REF_NAME#v}"; else ver="0.0.0"; fi
          cd apps/tauri/src-tauri/target/release/bundle
          for f in deb/*.deb; do mv "$f" "deb/amcl-tauri-linux-x64-${ver}.deb"; done
          for f in appimage/*.AppImage; do mv "$f" "appimage/amcl-tauri-linux-x64-${ver}.AppImage"; done
          for f in appimage/*.AppImage.sig; do mv "$f" "appimage/amcl-tauri-linux-x64-${ver}.AppImage.sig"; done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amcl-tauri-linux-x64
          path: |
            apps/tauri/src-tauri/target/release/bundle/deb/amcl-tauri-linux-x64-*.deb
            apps/tauri/src-tauri/target/release/bundle/appimage/amcl-tauri-linux-x64-*.AppImage
            apps/tauri/src-tauri/target/release/bundle/appimage/amcl-tauri-linux-x64-*.AppImage.sig

  electron-legacy-windows:
    name: Electron 22 兜底 Inno · x64+ia32
    runs-on: windows-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pin Inno Setup
        run: winget install --id JRSoftware.InnoSetup --exact --version 6.7.3 --silent --accept-package-agreements --accept-source-agreements
      - name: Build bundles
        run: pnpm -r build
      - name: Guard brand icon (缺则 fail，禁静默回退默认 Electron 图标)
        run: test -f apps/electron-legacy/build/icon.ico
      - name: electron-builder (--dir × x64+ia32)
        run: pnpm --filter @attic/electron-legacy run dist
      # 两架构目录构件各出一只 Inno 安装器（均为 32-bit 安装器本体，ia32 载荷覆盖
      # 32-bit Win7 主机；x64 载荷带 IsWin64 闸门）——一次构建两腿，循环即可不必 matrix
      - name: ISCC (legacy x64 + ia32)
        shell: pwsh
        # pwsh 戒律同主壳（Git Bash MSYS 会重写 /D 参数）；两架构目录构件各出一只 Inno 安装器
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = $env:GITHUB_REF_NAME.TrimStart('v') } else { $ver = '0.0.0' }
          foreach ($pair in @('x64|win-unpacked', 'ia32|win-ia32-unpacked')) {
            $arch, $dir = $pair -split '\|'
            & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
              "/DATTIC_FLAVOR=legacy" "/DATTIC_PAYLOAD=$PWD\apps\electron-legacy\release\$dir" `
              "/DATTIC_VERSION=$ver" "/DATTIC_ARCH=$arch" `
              'installer\attic.iss'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      # —— portable 目录构件（B 期终拍①，legacy 只发 x64 腿——兜底壳 portable 面 ia32 无需求）：
      # marker 住 resources/（非空位戒律同前两腿，详见 tauri 腿 Portable zip 步头注）——
      - name: Portable zip (x64)
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = $env:GITHUB_REF_NAME.TrimStart('v') } else { $ver = '0.0.0' }
          $folder = "amcl-legacy-windows-x64-$ver"
          $zip = "portable-dist\$folder-portable.zip"
          $payload = 'apps\electron-legacy\release\win-unpacked'
          # 守卫①：安装器载荷必须干净（portable.ini 只许在便携 staging 副本里）
          $dirty = @(Get-ChildItem -Recurse -Force -Path $payload -Filter portable.ini)
          if ($dirty.Count -gt 0) { throw "installer payload contaminated with portable.ini: $($dirty[0].FullName)" }
          New-Item -ItemType Directory -Force -Path "portable\$folder", portable-dist | Out-Null
          Copy-Item -Recurse "$payload\*" "portable\$folder\"
          Set-Content -Path "portable\$folder\resources\portable.ini" -Encoding ascii -Value @(
            '# Attic portable marker - do not delete: portable identity depends on this file.',
            '# rootDir = portable data root pointer; relative paths resolve against the app folder;',
            '# leave empty (factory default) to keep data in .attic beside the exe.',
            'rootDir='
          )
          $txt = @"
          Attic 便携版 —— 请先解压整个文件夹，勿在压缩包里直接运行

          1. 右键本 zip 选「全部解压」，或把 $folder 整个文件夹拖到目标位置（桌面/U 盘），
             进入文件夹双击其中的启动器 exe 运行。
          2. 不要在 WinRAR/7-Zip 里直接双击 exe：那会解压到临时目录运行，程序检测到后拒绝启动，
             数据也会丢在临时目录里。
          3. 游戏数据默认放在 exe 旁的 .attic 文件夹——整个文件夹拷到哪，数据就跟到哪。
          4. 新版本下载：https://github.com/CreatorCSIE/Attic-Minecraft-Launcher/releases

          "@
          [System.IO.File]::WriteAllText("$PWD\portable\先解压再运行.txt", $txt, (New-Object System.Text.UTF8Encoding($true)))
          Compress-Archive -Path "portable\$folder", "portable\先解压再运行.txt" -DestinationPath $zip -Force
          # 守卫②③：缺 marker = fail；含 .attic 条目 = fail（口径同前两腿）
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead("$PWD\$zip")
          try { $names = @($z.Entries | ForEach-Object FullName) } finally { $z.Dispose() }
          if ($names -notcontains "$folder/resources/portable.ini") { throw "portable zip missing marker: $folder/resources/portable.ini" }
          $leak = @($names | Where-Object { $_ -like '*/.attic/*' -or $_ -like '.attic/*' })
          if ($leak.Count -gt 0) { throw "portable zip contaminated with .attic entry: $($leak[0])" }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amcl-legacy-windows
          path: |
            installer/dist/amcl-legacy-windows-*-setup.exe
            portable-dist/amcl-legacy-windows-x64-*-portable.zip

