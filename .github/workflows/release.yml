name: Release（全平台矩阵）

# Phase 5 脚手架：主壳 = Tauri（Windows NSIS x64+arm64 / macOS DMG arm64 / Linux deb+AppImage x64），
# 兜底 = Electron 22 NSIS（x64 + ia32，Win7 SP1 下限）。
# 分发口径（用户拍板 2026-10-23）：Win/Mac arm64 照常发（壳原生，游戏侧走 x64 模拟 / Rosetta，
# 见 depends.ts 闸门）；Linux 优先 Debian 系（deb，arch/redhat 有需求再说），linux arm64 不分发
# （LWJGL2 无 arm64 原生库且无系统级模拟）。
# portable 目录构件（win zip / linux tar.xz）与 MSI 双轨 = 后续条目（plan.md）。
on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

jobs:
  gates:
    name: 发布前置闸门（全绿才出构件）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm run fixtures:check
      - run: pnpm run gate:node16

  tauri-windows-x64:
    name: Tauri NSIS · windows-x64（主发布轨）
    runs-on: windows-latest
    needs: gates
    env:
      # updater minisign 私钥只在发版 CI 注入（公钥已入 tauri.conf.json，plan 发版 SOP）
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # beforeBuildCommand（pnpm -r build）覆盖 ui/sidecar 产物；--bundles nsis 单目标（MSI 双轨 = 后续条目）
      - name: Tauri build
        run: pnpm --filter @attic/tauri exec tauri build --bundles nsis
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: attic-tauri-windows-x64
          path: |
            apps/tauri/src-tauri/target/release/bundle/nsis/*.exe
            apps/tauri/src-tauri/target/release/bundle/nsis/*.sig

  tauri-windows-arm64:
    name: Tauri NSIS · windows-arm64（持续线）
    runs-on: windows-latest
    needs: gates
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # 依赖 windows-latest 的 MSVC ARM64 生成工具组件（缺失则首跑在此报错，装组件即可）
      - name: Add rust target
        run: rustup target add aarch64-pc-windows-msvc
      - name: Tauri build (arm64)
        run: pnpm --filter @attic/tauri exec tauri build --target aarch64-pc-windows-msvc --bundles nsis
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: attic-tauri-windows-arm64
          path: |
            apps/tauri/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/tauri/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.sig

  tauri-macos-arm64:
    name: Tauri DMG · macOS arm64（持续线，Apple Silicon）
    runs-on: macos-latest # GitHub 托管 arm64 runner
    needs: gates
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # 游戏侧约束（depends.ts 闸门）：mac arm64 必须配 x86_64 JDK8 走 Rosetta——
      # 壳与 updater 原生 arm64，不影响分发。
      # Apple Developer 证书缺席时 tauri 跳过 codesign/notarize，用户需右键打开绕 Gatekeeper；
      # 上正式签名时补 APPLE_IDENTITY/APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID 环境组（TODO）。
      - name: Tauri build (arm64)
        run: pnpm --filter @attic/tauri exec tauri build --target aarch64-apple-darwin --bundles dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: attic-tauri-macos-arm64
          path: |
            apps/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            apps/tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz*

  tauri-linux-x64:
    name: Tauri DEB · linux-x64（持续线，Debian 系优先）
    runs-on: ubuntu-22.04
    needs: gates
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install system deps (webkit2gtk 等，Tauri v2 Linux 官方清单)
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # 拍板 2026-10-23：Linux 优先 Debian 系（deb）；arch/redhat 有需求再说。
      # AppImage 随发：Tauri v2 updater 在 Linux 仅支持 AppImage 通道（endpoint 钉好后即生效）。
      # linux arm64 不分发（LWJGL2 无 arm64 原生库且无系统级模拟，启动会被闸门拦）。
      - name: Tauri build (deb + appimage)
        run: pnpm --filter @attic/tauri exec tauri build --bundles deb,appimage
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: attic-tauri-linux-x64
          path: |
            apps/tauri/src-tauri/target/release/bundle/deb/*.deb
            apps/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/tauri/src-tauri/target/release/bundle/appimage/*.sig

  electron-legacy-windows:
    name: Electron 22 兜底 NSIS · x64+ia32
    runs-on: windows-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build bundles
        run: pnpm -r build
      - name: electron-builder NSIS
        run: pnpm --filter @attic/electron-legacy run dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: attic-electron-legacy-windows
          path: apps/electron-legacy/release/*.exe

  # TODO(发版 SOP)：latest.json（minisign 验签清单）生成与 GitHub Release 发布步骤；
  # sidecar 便携 node 随装策略（exe 目录 node.exe 或安装包内嵌）在此定稿。
