name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: 静态闸门（typecheck + build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 闸门不含游戏启动、不依赖版权资产；CI 无需 electron 二进制
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm -r build

      - name: Contract tests
        run: pnpm -r test
