name: Nightly（push 触发的试装构件轨道）

# 规格 = plan.md「Nightly 分发轨道与 changelog 分工」条（2026-10-26 B 案定稿，回归 SHVDN 原案）：
#  · 形态 = 同仓 on:push branches:[main] 每推必构建 + per-tag 不可变 release；
#    tag `v<base>-nightly.<YYYYMMDD>.<N>`（恒常序号 N≥1，当日首枚 = .1）；prerelease:true。
#  · 无新提交门：push 即有料信号，无推 = 无 run = 物理零记录（不留 schedule 绿跳过/红叉残留）。
#  · base = 根 package.json `attic.nightlyBase` 显式声明（0.0.x 期间 = 下一计划 stable 0.1.0，
#    不可从单一源 version 推导——单一源是"当前发布版"非"下一版"）。
#  · 转正 SOP = 即时流：push bump commit → 几分钟出 nightly 候选 → 验收 → 同 SHA tag stable
#    （tag push 不匹配 branches 过滤、不触发本轨，无尾夜无需守卫）。
#  · 定位纪律 = nightly 是手动下载试装构件分发面，不是 updater 通道：
#    永不生成/上传 latest.json（plan「更新通道设计」通道单轨 latest 无 beta/nightly）。
#  · notes = CI 自动极简模板四行封顶（自动构建声明 + short/full SHA + HEAD 标题 + run 链接），
#    零语义归纳（详细 changelog 只属 stable tag，见「发布说明供给设计」条）。
#  · 保留最近 14 个，清理 job 整删 release+tag；删除前 tag→主仓 full SHA→run URL 追加台账
#    （落点 = 常驻 draft release `nightly-history`，body 即 jsonl；draft 是硬约束——
#    published 非 prerelease 的 release 会抢占 releases/latest 通道位，污染 updater endpoint）。
#  · 成本收敛（B 案⑥）：concurrency 组内 cancel-in-progress——连推时旧 run 中间态无保留价值。
#
# 机制事实（本文件走 workflow_call 复用构建的原因，钉死防回坑）：
#   GITHUB_TOKEN 推的 tag 不会级联触发 push 事件（GitHub 递归保护：workflow 内
#   actions/checkout 默认 token 的写操作不触发新 workflow run）——且 branch 过滤本就
#   不匹配 tag push。所以 nightly 不能靠"推 tag → release.yml 的 on.push.tags 触发"
#   出构件，必须由本文件 `uses: release.yml`（workflow_call，release_mode=none 只要产物）
#   + 自己的 publish job 建 Release。
#
# workflow_dispatch 同走全链，用于手动补班（默认分支 main 上点 Run workflow）。
# 轨道解禁 = Actions 页 Enable workflow（纯 UI 开关）；disabled_manually 期间本文件零触发。

on:
  push:
    branches: [main] # B 案①：每推必构建；tag push 不匹配 branch 过滤，天然不自触发
  workflow_dispatch: {}

concurrency:
  group: nightly
  cancel-in-progress: true # B 案⑥：新推取消在跑旧 run（连推中间态无保留价值）

permissions:
  contents: write # plan job 推 tag + publish/cleanup 建删 Release
  actions: read

jobs:
  plan:
    name: tag 计算 + 打 tag（不可变纪律）
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
      short: ${{ steps.tag.outputs.short }}
      title: ${{ steps.tag.outputs.title }}
    steps:
      - uses: actions/checkout@v4
      - name: 计算并打 tag
        id: tag
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          short="$(git rev-parse --short=7 HEAD)"
          title="$(git log -1 --pretty=%s)"
          # 一次拉全部 tag（轻量 tag 无 ^{} 剥皮行，保险起见仍过滤）
          raw="$(git ls-remote --tags origin | grep -v '\^{}' || true)"
          names="$(awk '{ sub("refs/tags/", "", $2); print $2 }' <<<"$raw")"
          # base 显式声明源（plan「Nightly 分发轨道」条①：不可从根 version 推导）
          base="$(node -p "require('./package.json').attic.nightlyBase")"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::根 package.json attic.nightlyBase 缺失或非法：${base}"
            exit 1
          fi
          day="$(date -u +%Y%m%d)"
          # B 案③恒常 .N（N≥1，push 模式当日多枚成常态）：ls-remote 探测当日最大 N +1，
          # 当日首枚 = .1（不可变纪律下撞 tag 必须失败，后缀探测即其合法出口；
          # semver 数字标识符按数值比、逐段全序单调性成立）
          prefix="v${base}-nightly.${day}."
          maxn="$(awk -v p="$prefix" 'index($0, p) == 1 { s = substr($0, length(p) + 1); if (s ~ /^[0-9]+$/) print s }' <<<"$names" | sort -n | tail -n1)"
          tag="${prefix}$(( ${maxn:-0} + 1 ))"
          # 不可变纪律：push 前再查一次；git push 非 force，并发撞 tag 必失败退出，禁覆盖/--clobber
          if grep -qxF "$tag" <<<"$names"; then
            echo "::error::tag ${tag} 已存在（并发撞车）——不可变纪律，本次失败退出，禁覆盖"
            exit 1
          fi
          git tag "$tag" "$head_sha"
          git push origin "$tag"
          echo "已推 nightly tag：${tag} → ${short}（${title}）"
          {
            echo "tag=${tag}"
            echo "version=${tag#v}"
            echo "sha=${head_sha}"
            echo "short=${short}"
            echo "title=${title}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: 全平台构建（workflow_call 复用 release.yml 构建腿）
    needs: plan
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      release_mode: none # 只要产物；Release 由本文件 publish job 自产（tag 系本 workflow 所推，不级联触发）
    secrets: inherit # TAURI_UPDATER_PRIVATE_KEY 等不自动传入被调 workflow，显式 inherit

  publish:
    name: 建 nightly Release（prerelease + 四行极简 notes）
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
      SHORT: ${{ needs.plan.outputs.short }}
      TITLE: ${{ needs.plan.outputs.title }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 下载全部构件
        uses: actions/download-artifact@v4
        with:
          pattern: 'amcl-*'
          path: dist
      - name: 创建 per-tag 不可变 Release
        shell: bash
        run: |
          set -euo pipefail
          # notes 四行封顶（plan「changelog 分工」条：CI 自动极简模板、零语义归纳）——
          # run 链接行同时是 cleanup 台账的 run URL 取数点（勿改格式）
          {
            echo '自动构建，非发布版（nightly 试装轨，不进 updater 通道）'
            echo "commit: ${SHORT} (${SHA})"
            echo "HEAD: ${TITLE}"
            echo "run: ${RUN_URL}"
          } > notes.md
          mapfile -t files < <(find dist -type f | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then echo "::error::无 amcl-* 构件可挂"; exit 1; fi
          # 不可变纪律：禁 --clobber；tag 已由 plan job 推上，Release 已存在（重跑）= 此处炸，人工核对
          gh release create "$TAG" --prerelease --title "$TAG" --notes-file notes.md "${files[@]}"

  cleanup:
    name: 保留最近 14 个 nightly（整删 release+tag + 台账追加）
    needs: [plan, publish]
    if: always() # 发布失败也保清理节律（不依赖 plan 输出，纯按现存 release 数收敛）
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 清理 + 台账
        shell: bash
        run: |
          set -euo pipefail
          KEEP=14
          # 现存 nightly release（tag 含 -nightly.），版本序新→旧（tag 内嵌日期+序号，-V 单调）
          mapfile -t tags < <(gh api "repos/${REPO}/releases?per_page=100" --paginate \
            --jq '.[].tag_name' | grep -- '-nightly\.' | sort -V -r)
          echo "现存 nightly release：${#tags[@]} 个（保留最近 ${KEEP}）"
          if [[ "${#tags[@]}" -le "$KEEP" ]]; then echo "无需清理"; exit 0; fi
          # 台账 = 常驻 draft release（tag nightly-history，body 即 jsonl 台账；不存在则创建）。
          # draft 硬约束：published 非 prerelease 会抢占 releases/latest 通道位（updater endpoint 污染源）
          if ! gh release view nightly-history >/dev/null 2>&1; then
            : > ledger.jsonl
            gh release create nightly-history --draft \
              --title 'Nightly 台账（清理 job 自动维护，勿手改）' --notes-file ledger.jsonl
          fi
          gh api "repos/${REPO}/releases/tags/nightly-history" --jq '.body // ""' > ledger.jsonl
          for t in "${tags[@]:$KEEP}"; do
            # 删除前记账：tag → 主仓 full SHA → run URL（run URL 从 release body 的 run: 行提取）
            sha="$(gh api "repos/${REPO}/releases/tags/$t" --jq '.target_commitish')"
            run_url="$(gh release view "$t" --json body --jq '.body' \
              | grep -o 'https://[^ )]*actions/runs/[0-9]*' | head -n1 || true)"
            printf '{"tag":"%s","sha":"%s","run":"%s"}\n' "$t" "$sha" "$run_url" >> ledger.jsonl
            gh release edit nightly-history --notes-file ledger.jsonl
            # 整删 release + tag（--cleanup-tag；tag 永不复用，社区取信基线"同 tag 必得同包"）
            gh release delete "$t" --yes --cleanup-tag
            echo "已删 $t（台账已记）"
          done
