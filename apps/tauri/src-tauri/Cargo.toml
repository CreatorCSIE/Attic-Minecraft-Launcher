[package]
name = "attic-launcher"
version = "0.0.0"
description = "Attic Minecraft Launcher — Tauri 主发布壳（Windows NSIS）"
edition = "2021"
# 构建面 MSRV（plan.md Phase 5 拍板：Rust MSRV 1.90；CI windows-latest 自带 stable 满足）
rust-version = "1.90"

[lib]
name = "attic_launcher_lib"
# 桌面-only（Win/mac/Linux，无移动端）：staticlib/cdylib 是 Tauri 移动模板默认值，
# 留着 = 整个 lib 在 opt-3 下多 codegen 两遍 + 多链 DLL/LIB 两个白干产物（编译慢的头号放大器），
# 且 Defender 逐个啃上百 MB 中间 .lib/.dll 再拖链接尾。bin 只链 rlib，产物形态零变化。
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png：任务栏/标题栏图标显式注入用（include_image! 解 PNG，见 lib.rs app_icon）
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
