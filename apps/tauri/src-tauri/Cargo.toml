[package]
name = "attic-launcher"
version = "0.0.0"
description = "Attic Minecraft Launcher — Tauri 主发布壳（Windows NSIS）"
edition = "2021"
# 构建面 MSRV（plan.md Phase 5 拍板：Rust MSRV 1.90；CI windows-latest 自带 stable 满足）
rust-version = "1.90"

[lib]
name = "attic_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png：任务栏/标题栏图标显式注入用（include_image! 解 PNG，见 lib.rs app_icon）
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
