# electron-builder 兜底壳配置（Phase 5：Windows 目录构件，安装器由仓库级 Inno 出）。
# 注意：本壳与 Tauri 主壳分轨 —— 无自动更新（plan 拍板：兜底线手动更新）。
# 2026-10-24 路线拍板：nsis target 退场（观感老旧 + builder 模板宏层崩溃史），
# `--dir` 出 win-unpacked 目录 → ISCC 编译 installer/attic.iss（/DATTIC_FLAVOR="legacy"）。
appId: uk.attic.launcher.legacy
productName: Attic Minecraft Launcher Legacy
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
# UI 入包（v0.0.1 pre-release 落实，与 apps/electron 壳同改）：packages/ui/dist 随装为
# resources/ui，main.ts（legacy 同源复用）uiDistIndex 按 app.isPackaged 走产线分支。
extraResources:
  - from: ../../packages/ui/dist
    to: ui
win:
  icon: build/icon.ico
  target:
    - target: dir
      arch: [x64, ia32]
